name: Release validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9.22'
      - name: Install validation environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python -m pip install --no-deps dist/*.whl
      - name: Validate installation and algorithms outside the source tree
        run: |
          cd /tmp
          timeout 60s python -m pytest "$GITHUB_WORKSPACE/tests/release" -q
      - name: Check English release files and source distribution
        run: |
          python setup.py sdist
          python scripts/check_release.py --sdist dist/metalprot-*.tar.gz
